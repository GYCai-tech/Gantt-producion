<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GYC · Producción del día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ static_v }}" />
</head>

<body>

  <header class="topbar">
    <span class="brand"><strong>GYC</strong> · Producción del día</span>

    <div class="controls">
      <button class="icon-btn" onclick="App.nav(-1)" aria-label="Día anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <input class="date" type="date" id="dia" onchange="App.setDia(this.value)" />
      <button class="icon-btn" onclick="App.nav(1)" aria-label="Día siguiente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="btn" onclick="App.hoy()">Hoy</button>
      <button class="btn btn--ghost" id="btn-recargar" onclick="App.cargar()" title="Volver a leer del ERP">
        <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Actualizar
      </button>
    </div>

    <div class="topbar__right">
      <span class="stat" id="stat"></span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main class="gantt" id="gantt">
    <div class="gantt__head">
      <div class="rail rail--head">Operario</div>
      <div class="axis" id="axis"></div>
    </div>
    <div class="gantt__rows" id="rows"></div>
    <div class="state" id="state" hidden></div>
  </main>

  <div class="tip" id="tip" hidden></div>

  <script src="/static/js/app.js?v={{ static_v }}"></script>
</body>

</html>
