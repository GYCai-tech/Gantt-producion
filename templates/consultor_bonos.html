{% extends "base.html" %}
{% block title %}GYC · Consultor de bonos{% endblock %}

{% block navbar_extra %}
<div class="search-gantt-wrap">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  <input id="con-buscar" type="search" placeholder="Orden, bono, artículo o máquina…" oninput="Consultor.setBusqueda(this.value)">
</div>
<button class="btn-refresh" onclick="Consultor.cargar()" title="Volver a leer el ERP">
  <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  <span id="refresh-label">Actualizar</span>
</button>
<span class="topbar__clock plan-clock" id="generado"></span>
{% endblock %}

{% block body %}
<div class="app">
  <main class="panel plan">

    <header class="plan__intro">
      <h1>Consultor de bonos</h1>
    </header>

    <div id="con-cargando" class="plan__estado">Leyendo el ERP…</div>
    <div id="con-error" class="plan__estado plan__estado--error" hidden></div>

    <div id="con-cuerpo" hidden>
      <div class="ord__barra">
        <div class="segmented segmented--lg" id="con-filtros"></div>
        <select id="con-maquina" class="select-lg" onchange="Consultor.setMaquina(this.value)"></select>
        <span class="ord__cuenta" id="con-resumen"></span>
      </div>

      <div class="plan__wrap ord__wrap">
        <table class="plan__tabla ord__tabla ord__tabla--lg" id="con-tabla"></table>
      </div>
      <p class="plan__vacio" id="con-sin-resultados" hidden>Sin resultados para ese filtro.</p>
    </div>

  </main>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/consultor.js?v={{ static_v }}"></script>
{% endblock %}
