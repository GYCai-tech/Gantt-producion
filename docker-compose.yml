services:
  planificador:
    build: .
    container_name: gyc-planificador
    ports:
      - "8001:8000"
      - "70:8000"
    env_file:
      - .env
    environment:
      # Sin esto el contenedor va en UTC y `date.today()` / la conversion de
      # la ventana que manda el frontend se irian un dia entero.
      - TZ=Europe/Madrid
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # acceso al ERP en la red local

# Nota: el código (app/templates/static) va dentro de la imagen.
# Tras cambiar código/plantillas:  docker compose up -d --build
# Para hot-reload en desarrollo, ver docker-compose.dev.yml
